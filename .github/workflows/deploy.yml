name: Minify and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Minification Tools
        run: npm install -g terser clean-css-cli html-minifier

      - name: Build, Minify, and Prepare gh-pages Directory
        run: |
          # Create the temporary build directory
          mkdir gh-pages

          # 1. Minify JavaScript (app.js)
          terser app.js --compress --mangle --output gh-pages/app.js

          # 2. Minify CSS (style.css)
          cleancss -o gh-pages/style.css style.css

          # 3. Minify HTML (index.html)
          html-minifier --collapse-whitespace --remove-comments --remove-optional-tags --remove-redundant-attributes --use-short-doctype index.html -o gh-pages/index.html

          # 4. Copy Static Assets & Configs Verbatim
          cp -r assets gh-pages/
          cp CNAME robots.txt sitemap.xml site.webmanifest service-worker.js gh-pages/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
